<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Type a word, hatch a creature: the creature that word was always going to be.">
    <title>Wildseed</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 12' shape-rendering='crispEdges'%3E%3Cpath fill='%232b2238' d='M3 0h4v1h1v2h1v3h1v4h-1v1h-1v1h-6v-1h-1v-1h-1v-4h1v-3h1v-2h1z'/%3E%3Cpath fill='%23fff1c4' d='M3 1h4v2h1v3h1v4h-1v1h-6v-1h-1v-4h1v-3h1z'/%3E%3Cpath fill='%238fca72' d='M4 3h2v2h-2zM6 7h2v2h-2zM2 8h2v1h-2z'/%3E%3C/svg%3E">
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1 class="logo">wild<span>seed</span></h1>
        <form class="hatch" autocomplete="off" novalidate>
          <input data-testid="seed-input" name="seed" aria-label="A word or lineage to hatch" placeholder="a word, or thomas * auri…" spellcheck="false" enterkeyhint="go">
          <button type="submit" class="btn hatch-btn">Hatch</button>
          <button type="button" class="btn" data-testid="random">Random</button>
        </form>
        <button type="button" class="btn sound" aria-pressed="true" title="Sound on or off">Sound on</button>
        <p class="error" data-testid="seed-error" role="alert" hidden></p>
      </header>
      <main class="hatchery">
        <section class="play-area">
          <div class="crossing">
            <div class="cross-heading"><div><span class="eyebrow">THE CROSSING GARDEN</span><h2>A little of you. A little of them.</h2></div><span class="cross-mark" aria-hidden="true">✳</span></div>
            <form class="cross-form" autocomplete="off" novalidate>
              <div class="parent-slot"><canvas class="parent-portrait" width="72" height="72" aria-label="First parent preview"></canvas><label>Your word<input id="parent-a" value="thomas" aria-label="First parent" spellcheck="false"></label><button type="button" class="use-current" data-parent="a">Use current</button></div>
              <span class="cross-times" aria-hidden="true">×</span>
              <div class="parent-slot"><canvas class="parent-portrait" width="72" height="72" aria-label="Second parent preview"></canvas><label>Their word<input id="parent-b" value="auri" aria-label="Second parent" spellcheck="false"></label><button type="button" class="use-current" data-parent="b">Use current</button></div>
              <button class="btn cross-submit" type="submit">Lay an egg <span aria-hidden="true">↗</span></button>
            </form>
            <p class="cross-note">Two names make a creature only they could make.</p>
          </div>
          <div class="stage"><div class="stage-caption"><span class="eyebrow">A SMALL WORLD OF YOUR OWN</span><p class="stage-status" role="status">Someone is waking up…</p></div><canvas data-testid="scene" aria-label="The creature, in 3D: drag to turn the camera, click it to poke it"></canvas><div class="stage-footer">DRAG TO TURN <span>✦</span> TAP TO SAY HELLO</div></div>
        </section>
        <aside class="side">
          <article class="card" data-testid="creature-card">
            <p class="rare" hidden>★ rare</p>
            <h2 class="name">…</h2>
            <p class="kind"><span class="species"></span> · <span class="affinity"></span></p>
            <p class="about"></p>
            <dl class="stats"></dl>
            <p class="seed"></p>
          </article>
          <div class="child-actions" hidden><button class="btn next-egg" type="button">Next egg</button><button class="btn breed-child" type="button">Cross this child</button></div>
          <div class="share">
            <button type="button" class="btn" data-testid="save-gif">Save GIF</button>
            <button type="button" class="btn" data-testid="save-card">Save card</button>
          </div>
          <button class="btn copy-link" type="button">Copy creature link ↗</button><p class="hint">Drag to turn the camera, click the creature to poke it.</p>
          <section class="hatched" hidden>
            <h3>Hatched here</h3>
            <nav class="recent" aria-label="Creatures hatched on this device"></nav>
          </section>
        </aside>
        <section class="family" data-testid="family-tree" hidden></section>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
