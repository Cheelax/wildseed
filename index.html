<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Type a word, hatch a creature: the creature that word was always going to be. Type two, and they lay an egg.">
    <title>Wildseed</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 12' shape-rendering='crispEdges'%3E%3Cpath fill='%232b2238' d='M3 0h4v1h1v2h1v3h1v4h-1v1h-1v1h-6v-1h-1v-1h-1v-4h1v-3h1v-2h1z'/%3E%3Cpath fill='%23fff1c4' d='M3 1h4v2h1v3h1v4h-1v1h-6v-1h-1v-4h1v-3h1z'/%3E%3Cpath fill='%238fca72' d='M4 3h2v2h-2zM6 7h2v2h-2zM2 8h2v1h-2z'/%3E%3C/svg%3E">
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1 class="logo">wild<span>seed</span></h1>
        <form class="hatch" autocomplete="off" novalidate>
          <input data-testid="seed-input" name="seed" aria-label="A word to hatch, or a lineage like thomas × auri" placeholder="your name, a word…" spellcheck="false" enterkeyhint="go">
          <span class="times" aria-hidden="true">×</span>
          <input name="mate" aria-label="A second creature to lay an egg with" placeholder="a friend's name" spellcheck="false" enterkeyhint="go">
          <button type="submit" class="btn hatch-btn">Hatch</button>
          <button type="button" class="btn" data-testid="random">Random</button>
        </form>
        <button type="button" class="btn sound" aria-pressed="true" title="Sound on or off">Sound on</button>
        <p class="error" data-testid="seed-error" role="alert" hidden></p>
      </header>
      <main class="hatchery">
        <div class="stage">
          <canvas data-testid="scene" aria-label="The creature, in 3D: drag to turn the camera, click it to poke it"></canvas>
          <p class="news" role="status" hidden></p>
        </div>
        <aside class="side">
          <article class="card" data-testid="creature-card">
            <p class="rare" hidden>★ rare</p>
            <h2 class="name">…</h2>
            <p class="kind"><span class="species"></span> · <span class="affinity"></span></p>
            <p class="kin" hidden></p>
            <p class="about"></p>
            <dl class="stats"></dl>
            <p class="seed"></p>
          </article>
          <div class="eggs">
            <button type="button" class="btn prev" aria-label="The egg before">◀</button>
            <p class="which"></p>
            <button type="button" class="btn hatch-btn next" aria-label="Lay their next egg">Next egg ▶</button>
            <button type="button" class="btn mate">Find it a mate</button>
          </div>
          <section class="family" data-testid="family-tree" hidden></section>
          <div class="share">
            <button type="button" class="btn" data-testid="save-gif">Save GIF</button>
            <button type="button" class="btn" data-testid="save-card">Save card</button>
            <button type="button" class="btn save-tree">Save tree</button>
            <button type="button" class="btn copy-link">Copy link</button>
          </div>
          <p class="hint">Type a friend's name after × to lay an egg. Drag to turn the camera, click a creature to poke it.</p>
          <section class="hatched" hidden>
            <h3>Hatched here <small>× lays an egg with the one on screen</small></h3>
            <nav class="recent" aria-label="Creatures hatched on this device"></nav>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
