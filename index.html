<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Type a word, hatch a creature. Cross two creatures, and they lay an egg: out comes their child.">
    <title>Wildseed</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 12' shape-rendering='crispEdges'%3E%3Cpath fill='%232b2238' d='M3 0h4v1h1v2h1v3h1v4h-1v1h-1v1h-6v-1h-1v-1h-1v-4h1v-3h1v-2h1z'/%3E%3Cpath fill='%23fff1c4' d='M3 1h4v2h1v3h1v4h-1v1h-6v-1h-1v-4h1v-3h1z'/%3E%3Cpath fill='%238fca72' d='M4 3h2v2h-2zM6 7h2v2h-2zM2 8h2v1h-2z'/%3E%3C/svg%3E">
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1 class="logo">wild<span>seed</span></h1>
        <form class="hatch" autocomplete="off" novalidate>
          <input data-testid="seed-input" name="seed" aria-label="A word or a cross to hatch" placeholder="a word, your name, or a cross: you × a friend" spellcheck="false" enterkeyhint="go">
          <button type="submit" class="btn hatch-btn">Hatch</button>
          <button type="button" class="btn" data-testid="random">Random</button>
        </form>
        <button type="button" class="btn sound" aria-pressed="true" title="Sound on or off">Sound on</button>
        <p class="error" data-testid="seed-error" role="alert" hidden></p>
      </header>
      <main class="hatchery">
        <div class="stage"><canvas data-testid="scene" aria-label="The creature, in 3D: drag to turn the camera, click it to poke it"></canvas></div>
        <aside class="side">
          <article class="card" data-testid="creature-card">
            <p class="rare" hidden>★ rare</p>
            <h2 class="name">…</h2>
            <p class="kind"><span class="species"></span> · <span class="affinity"></span></p>
            <p class="about"></p>
            <dl class="stats"></dl>
            <p class="seed"></p>
            <p class="parents"></p>
            <p class="mutant"></p>
          </article>
          <div class="share">
            <button type="button" class="btn" data-testid="save-gif">Save GIF</button>
            <button type="button" class="btn" data-testid="save-card">Save card</button>
          </div>
          <section class="nest" data-testid="cross">
            <h3>Lay an egg</h3>
            <form class="couple" autocomplete="off" novalidate>
              <input data-testid="parent-a" aria-label="The first parent" placeholder="your name" spellcheck="false">
              <span class="times" aria-hidden="true">×</span>
              <input data-testid="parent-b" aria-label="The second parent" placeholder="a friend's" spellcheck="false" enterkeyhint="go">
              <button type="submit" class="btn lay" data-testid="lay-egg">Lay an egg</button>
            </form>
            <p class="clutch" hidden>
              <span class="what"></span>
              <button type="button" class="btn small" data-testid="next-egg">Lay egg #2</button>
              <button type="button" class="btn small" data-testid="cross-again">Cross it with…</button>
            </p>
          </section>
          <section class="family" data-testid="family-tree" hidden>
            <h3>Family tree</h3>
            <div class="tree-holder"></div>
            <button type="button" class="btn save-tree" data-testid="save-tree">Save tree</button>
          </section>
          <p class="hint">Drag to turn the camera, click a creature to poke it. Drag one you hatched onto the scene, or press its ♥, to cross it with the one on screen.</p>
          <section class="hatched" hidden>
            <h3>Hatched here</h3>
            <nav class="recent" aria-label="Creatures hatched on this device"></nav>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
